spring.application.name=printer

# Example for PostgreSQL
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.properties.hibernate.hbm2ddl.schema_generation.script_action=create
spring.jpa.properties.hibernate.hbm2ddl.schema_generation.scripts.create-target=ddl.sql
spring.jpa.properties.hibernate.hbm2ddl.schema_generation.scripts.create-source=metadata
